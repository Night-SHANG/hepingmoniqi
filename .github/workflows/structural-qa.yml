name: v0.9 authoritative game and structural QA
on:
  push:
    branches: [v09-structural-lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_SCOPE: ${{ contains(github.event.head_commit.message, '[qa:city-effects]') && 'city-effects' || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - id: build
        run: npm run build:structural
      - run: google-chrome --version
      - name: Start independent preview servers
        run: |
          python3 -m http.server 5192 --bind 127.0.0.1 --directory dist >/tmp/structural-game-server.log 2>&1 &
          python3 -m http.server 5191 --bind 127.0.0.1 --directory dist-structural >/tmp/structural-server.log 2>&1 &
          python3 - <<'PYREADY'
          import time, urllib.request
          for port in (5191, 5192):
              for attempt in range(50):
                  try:
                      urllib.request.urlopen(f"http://127.0.0.1:{port}/", timeout=1)
                      break
                  except OSError:
                      time.sleep(.1)
              else:
                  raise RuntimeError(f"Preview server {port} did not start")
          PYREADY
      - name: Formal game UI and authoritative terrain
        env:
          QA_BROWSER_CHANNEL: chrome
          GAME_URL: http://127.0.0.1:5192
        run: |
          node scripts/game-save-browser-check.mjs
          node scripts/structural-game-browser-check.mjs
      - name: Structural entry smoke and real screenshots
        if: ${{ success() && !contains(github.event.head_commit.message, '[qa:city-effects]') }}
        env:
          QA_BROWSER_CHANNEL: chrome
        run: |
          node scripts/structural-browser-check.mjs
      - name: Eight profile render phases (not full weapon gameplay)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          QA_BROWSER_CHANNEL: chrome
        run: node scripts/structural-effects-browser-check.mjs
