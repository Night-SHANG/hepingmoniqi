name: Draft original v0.7 ZIP on current archive container
on:
  push:
    branches: [archive-v07-original-package]
    paths: [.github/workflows/archive-release.yml]
permissions:
  contents: read
jobs:
  archive:
    if: github.repository == 'Night-SHANG/hepingmoniqi' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify original bytes and create historical non-latest draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 archive/publish.py
