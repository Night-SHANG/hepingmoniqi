name: Public browser QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real WebGL and input acceptance
        run: |
          python3 -m http.server 5191 --bind 127.0.0.1 --directory dist >/tmp/heping-server.log 2>&1 &
          node scripts/browser-check.mjs
