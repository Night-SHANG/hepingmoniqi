name: Public browser QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: google-chrome --version
      # Visual-only commits retain unit/build checks and run focused real-WebGL captures.
      - name: Real WebGL and input acceptance
        if: ${{ !contains(github.event.head_commit.message, '[visual-only]') }}
        env:
          QA_BROWSER_CHANNEL: chrome
        run: |
          python3 -m http.server 5191 --bind 127.0.0.1 --directory dist >/tmp/heping-server.log 2>&1 &
          node scripts/browser-check.mjs
          node scripts/projectile-browser-check.mjs
          node scripts/v03-browser-check.mjs
      - name: Real weapon visual acceptance
        env:
          QA_BROWSER_CHANNEL: chrome
        run: |
          python3 -m http.server 5192 --bind 127.0.0.1 --directory dist >/tmp/heping-visual-server.log 2>&1 &
          GAME_URL=http://127.0.0.1:5192 node scripts/weapon-visual-check.mjs
