name: Public browser QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --test scripts/v07-qa-contract.test.mjs scripts/v07-qa-fixtures.test.mjs
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -v
      - run: npm run build
      - run: google-chrome --version
      - name: v0.7 vertical layout and expansion acceptance
        env:
          QA_BROWSER_CHANNEL: chrome
        run: |
          python3 -m http.server 5191 --bind 127.0.0.1 --directory dist >/tmp/heping-server.log 2>&1 &
          node scripts/v07-browser-check.mjs
